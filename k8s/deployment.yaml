apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskpilot-api
  labels:
    app: taskpilot-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: taskpilot-api
  template:
    metadata:
      labels:
        app: taskpilot-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: taskpilot
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: taskpilot-config
          env:
            
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskpilot-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql+psycopg2://taskpilot:$(POSTGRES_PASSWORD)@postgres:5432/taskpilot
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: taskpilot-secrets
                  key: JWT_SECRET
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: taskpilot-secrets
                  key: LLM_API_KEY
                  optional: true
          # Migrations run before uvicorn starts, so give startup room before liveness applies.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
