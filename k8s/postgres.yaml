apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None # headless: governs the StatefulSet and resolves "postgres" to the pod
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: taskpilot
            - name: POSTGRES_USER
              value: taskpilot
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskpilot-secrets
                  key: POSTGRES_PASSWORD
            # A subdirectory, because the volume root contains lost+found on some providers.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "taskpilot", "-d", "taskpilot"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "taskpilot", "-d", "taskpilot"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
